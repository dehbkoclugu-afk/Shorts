name: FastTrack — Render Storyboards

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Comma-separated locales
        required: true
        default: tr,en
        type: string
      count:
        description: Number of master concepts (1-14)
        required: true
        default: 14
        type: number

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install "Pillow>=10.0.0"

      - name: Build safe content pack
        run: >-
          python -m fasttrack.src.planner
          --locales "${{ inputs.locales }}"
          --count "${{ inputs.count }}"
          --output fasttrack/output

      - name: Render branded storyboards
        run: >-
          python -m fasttrack.src.storyboards
          --pack fasttrack/output/content-pack.json
          --output fasttrack/output/storyboards

      - name: Build production baseline report
        run: >-
          python -m fasttrack.src.report
          --calendar fasttrack/output/content-calendar.csv
          --output fasttrack/output/weekly-report.md

      - name: Upload storyboard review package
        uses: actions/upload-artifact@v4
        with:
          name: fasttrack-storyboards-${{ github.run_id }}
          path: fasttrack/output/
          if-no-files-found: error
          retention-days: 14

