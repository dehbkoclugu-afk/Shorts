name: Smart Dispatcher — Unified Daily System

on:
  workflow_dispatch:
    inputs:
      system:
        description: 'Hangi sistem başlatılsın?'
        required: true
        default: 'Hz'
        type: choice
        options:
          - Hz (FREQ SHORTS)
          - en (WAR SHORTS - English)
          - tr (WAR SHORTS - Türkçe)
      count:
        description: 'Kuyruğa kaç video eklensin? (default: 7 for Freq, 10 for War)'
        required: false
        type: string
      action:
        description: 'İşlem'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - stop
  schedule:
    # Her gün 01:00 UTC (Freq), 02:00 UTC (War)
    # Aktif olan sistem çalışır
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'

jobs:
  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ─── FREQ SHORTS Queue ──────────────────────────────────────────────

      - name: Restore FREQ queue cache
        if: |
          (github.event.inputs.system == 'Hz (FREQ SHORTS)' || github.event_name == 'schedule') &&
          vars.ACTIVE_SYSTEM == 'Hz'
        uses: actions/cache@v4
        with:
          path: freq_scheduled_queue.json
          key: freq-queue-${{ github.run_id }}
          restore-keys: freq-queue-

      - name: Restore FREQ used topics cache
        if: |
          (github.event.inputs.system == 'Hz (FREQ SHORTS)' || github.event_name == 'schedule') &&
          vars.ACTIVE_SYSTEM == 'Hz'
        uses: actions/cache@v4
        with:
          path: freq_used_topics.json
          key: freq-used-topics-${{ github.run_id }}
          restore-keys: freq-used-topics-

      - name: Enable FREQ SHORTS Daily Mode
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.system == 'Hz (FREQ SHORTS)' &&
          github.event.inputs.action == 'enable'
        run: |
          python dispatcher.py Hz --count ${{ github.event.inputs.count || '7' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run FREQ SHORTS Daily Pipeline
        if: |
          (github.event_name == 'schedule' && vars.ACTIVE_SYSTEM == 'Hz') ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.system == 'Hz (FREQ SHORTS)' &&
           github.event.inputs.action == 'enable')
        run: |
          USE_FREQ_QUEUE=true python freq_main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_FREQ_QUEUE: 'true'

      - name: Save FREQ queue cache
        if: always() && vars.ACTIVE_SYSTEM == 'Hz'
        uses: actions/cache@v4
        with:
          path: freq_scheduled_queue.json
          key: freq-queue-${{ github.run_id }}

      - name: Save FREQ used topics cache
        if: always() && vars.ACTIVE_SYSTEM == 'Hz'
        uses: actions/cache@v4
        with:
          path: freq_used_topics.json
          key: freq-used-topics-${{ github.run_id }}

      - name: Commit FREQ state files
        if: always() && vars.ACTIVE_SYSTEM == 'Hz'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add freq_scheduled_queue.json freq_used_topics.json dispatcher_scheduler.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update freq state after dispatcher run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      # ─── WAR SHORTS Queue ───────────────────────────────────────────────

      - name: Restore WAR queue cache (en)
        if: |
          contains(github.event.inputs.system, 'en (WAR') &&
          vars.ACTIVE_SYSTEM == 'en'
        uses: actions/cache@v4
        with:
          path: war_scheduled_queue.json
          key: war-queue-en-${{ github.run_id }}
          restore-keys: war-queue-en-

      - name: Restore WAR used topics cache (en)
        if: |
          contains(github.event.inputs.system, 'en (WAR') &&
          vars.ACTIVE_SYSTEM == 'en'
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-en-${{ github.run_id }}
          restore-keys: used-topics-en-

      - name: Enable WAR SHORTS Daily Mode (en)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.system == 'en (WAR SHORTS - English)' &&
          github.event.inputs.action == 'enable'
        run: |
          python dispatcher.py en --count ${{ github.event.inputs.count || '10' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Restore WAR queue cache (tr)
        if: |
          github.event.inputs.system == 'tr (WAR SHORTS - Türkçe)' &&
          vars.ACTIVE_SYSTEM == 'tr'
        uses: actions/cache@v4
        with:
          path: war_scheduled_queue_tr.json
          key: war-queue-tr-${{ github.run_id }}
          restore-keys: war-queue-tr-

      - name: Restore WAR used topics cache (tr)
        if: |
          github.event.inputs.system == 'tr (WAR SHORTS - Türkçe)' &&
          vars.ACTIVE_SYSTEM == 'tr'
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-tr-${{ github.run_id }}
          restore-keys: used-topics-tr-

      - name: Enable WAR SHORTS Daily Mode (tr)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.system == 'tr (WAR SHORTS - Türkçe)' &&
          github.event.inputs.action == 'enable'
        run: |
          python dispatcher.py tr --count ${{ github.event.inputs.count || '10' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Run WAR SHORTS Daily Pipeline
        if: |
          (github.event_name == 'schedule' && vars.ACTIVE_SYSTEM == 'en') ||
          (github.event_name == 'workflow_dispatch' &&
           contains(github.event.inputs.system, 'WAR SHORTS') &&
           github.event.inputs.action == 'enable')
        run: |
          LANGUAGE=${{ contains(github.event.inputs.system, 'Türkçe') && 'tr' || 'en' }}
          USE_QUEUE=true LANGUAGE=$LANGUAGE python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_QUEUE: 'true'

      - name: Save WAR queue cache
        if: always() && contains(vars.ACTIVE_SYSTEM, 'en') || contains(vars.ACTIVE_SYSTEM, 'tr')
        uses: actions/cache@v4
        with:
          path: |
            war_scheduled_queue.json
            war_scheduled_queue_tr.json
          key: war-queue-${{ github.run_id }}

      - name: Commit WAR state files
        if: always() && (vars.ACTIVE_SYSTEM == 'en' || vars.ACTIVE_SYSTEM == 'tr')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add war_scheduled_queue.json war_scheduled_queue_tr.json used_topics.json dispatcher_scheduler.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update war state after dispatcher run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      # ─── Disable System ──────────────────────────────────────────────

      - name: Disable System
        if: github.event.inputs.action == 'stop'
        run: |
          SYSTEM=$(echo "${{ github.event.inputs.system }}" | cut -d' ' -f1)
          python dispatcher.py $SYSTEM stop

      # ─── Show Status ─────────────────────────────────────────────────

      - name: Show Dispatcher Status
        if: always()
        run: python dispatcher.py status

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-output-${{ github.run_id }}
          path: output/
          retention-days: 3
