name: FastTrack — Build Content Pack

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Comma-separated locales
        required: true
        default: tr,en
        type: string
      count:
        description: Number of master concepts (1-14)
        required: true
        default: 14
        type: number

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependency
        run: python -m pip install "Pillow>=10.0.0"

      - name: Run FastTrack tests
        run: python -m unittest discover -s fasttrack/tests -v

      - name: Build content pack
        run: >-
          python -m fasttrack.src.planner
          --locales "${{ inputs.locales }}"
          --count "${{ inputs.count }}"
          --output fasttrack/output

      - name: Upload review pack
        uses: actions/upload-artifact@v4
        with:
          name: fasttrack-content-pack-${{ github.run_id }}
          path: fasttrack/output/
          if-no-files-found: error
          retention-days: 14

